<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h2v14H6zM20 5v14L9 12z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></symbol>
  </svg>

  <main class="app">
    <section class="player" aria-label="Music player">
      <div class="disc" id="disc" aria-hidden="true"></div>
      <h1 id="title">Song title</h1>
      <p class="artist" id="artist">Artist</p>

      <div class="progress-wrap">
        <input type="range" id="progress" min="0" max="100" step="0.1" value="0" aria-label="Seek">
        <div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div>
      </div>

      <div class="controls">
        <button id="prev" aria-label="Previous song"><svg><use href="#i-prev"/></svg></button>
        <button id="play" class="main" aria-label="Play"><svg><use id="play-icon" href="#i-play"/></svg></button>
        <button id="next" aria-label="Next song"><svg><use href="#i-next"/></svg></button>
      </div>

      <div class="extras">
        <div class="volume">
          <button id="mute" aria-label="Mute"><svg><use id="vol-icon" href="#i-vol"/></svg></button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
        <label class="switch"><input type="checkbox" id="autoplay" checked><span>Autoplay</span></label>
      </div>
    </section>

    <section class="playlist" aria-label="Playlist">
      <h2>Playlist</h2>
      <ol id="playlist"></ol>
      <p class="hint">Keys: Space play/pause, ← → seek, ↑ ↓ volume, N next, P previous, M mute</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
